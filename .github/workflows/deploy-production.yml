name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

env:
  NODE_VERSION: '20.16.0'
  AWS_REGION: 'us-east-1'

jobs:
  validate-input:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment confirmation
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "❌ Deployment confirmation failed. Please type 'deploy' to confirm."
          exit 1

  deploy-infrastructure:
    needs: validate-input
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
          
      - name: Terraform Init
        working-directory: infra/prod
        run: terraform init
        
      - name: Terraform Plan
        working-directory: infra/prod
        run: terraform plan -out=tfplan
        
      - name: Terraform Apply
        working-directory: infra/prod
        run: terraform apply -auto-approve tfplan

  build-and-deploy:
    needs: [validate-input, deploy-infrastructure]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm nx run-many --target=build --projects=@brenda-nails/shared,@brenda-nails/ui
        
      - name: Build applications
        run: pnpm build
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy to S3
        run: |
          aws s3 sync apps/frontend/dist/ s3://brenda-nails-prod-website --delete --cache-control max-age=31536000,public
          aws s3 cp apps/frontend/dist/index.html s3://brenda-nails-prod-website/index.html --cache-control max-age=0,no-cache,no-store,must-revalidate
