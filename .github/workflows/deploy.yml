name: deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (true/false)"
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_WORKING_DIR: infra

jobs:
  probe:
    # Manual OIDC probe without terraform apply
    if: github.event_name == 'workflow_dispatch' && vars.AWS_ACCOUNT_ID != '' && vars.GHA_ROLE_NAME != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.GHA_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller identity
        run: aws sts get-caller-identity

  apply:
    # Skip if required variables are not configured in the repo
    if: >-
      (github.event_name == 'push' && vars.AWS_ACCOUNT_ID != '' && vars.GHA_ROLE_NAME != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.apply == 'true' && vars.AWS_ACCOUNT_ID != '' && vars.GHA_ROLE_NAME != '')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Ensure pnpm
        run: |
          npm i -g pnpm@9
          pnpm -v

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace deps
        run: pnpm -w install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.GHA_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_IN_AUTOMATION: "1"
        run: terraform apply -auto-approve -input=false


