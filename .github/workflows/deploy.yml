name: Deploy Website

on:
  push:
    branches: [ main ]
    paths: ['apps/frontend/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (npm)
        run: |
          cd apps/frontend
          npm install

      - name: Build frontend (npm)
        run: |
          cd apps/frontend
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.GHA_ROLE_NAME }}
          aws-region: eu-west-2

      - name: Deploy to S3 and CloudFront
        run: |
          cd apps/frontend
          
          # Sync to S3
          aws s3 sync dist/ s3://brenda-nails.com/ --delete \
            --cache-control "public,max-age=31536000" \
            --exclude "*.html" \
            --exclude "*.json"
          
          # Upload HTML with no-cache
          aws s3 sync dist/ s3://brenda-nails.com/ \
            --cache-control "no-cache" \
            --include "*.html" \
            --include "*.json"
          
          # Find and invalidate CloudFront
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DefaultCacheBehavior.TargetOriginId=='s3-site'].Id" \
            --output text | head -1)
          
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
            echo "✅ CloudFront invalidated: $DISTRIBUTION_ID"
          fi
