<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>
  
  <!-- Play button circle -->
  <circle cx="200" cy="250" r="40" fill="white" fill-opacity="0.9" stroke="#e11d48" stroke-width="2"/>
  
  <!-- Play icon -->
  <path d="M185 235 L215 250 L185 265 Z" fill="#e11d48"/>
  
  <!-- Text -->
  <text x="200" y="320" text-anchor="middle" fill="#374151" font-family="Inter, system-ui" font-size="18" font-weight="600">
    Meet Brenda
  </text>
  <text x="200" y="345" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui" font-size="14">
    Click to play video
  </text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="100" r="20" fill="#f9a8d4" fill-opacity="0.3"/>
  <circle cx="320" cy="400" r="25" fill="#ec4899" fill-opacity="0.2"/>
  <circle cx="350" cy="150" r="15" fill="#be185d" fill-opacity="0.4"/>
</svg>
